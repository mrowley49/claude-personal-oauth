<h1>Claude Personal</h1>
<p>A private, single-user tool that lets the owner's local scripts read and manage the owner's own Google Workspace data (Gmail, Drive, Docs, Sheets, Slides, Calendar, Tasks, Meet).</p>
<p>It is not offered to the public. See the <a href="privacy.html">privacy policy</a>.</p>
